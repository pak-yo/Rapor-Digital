
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rapor Digital</title>

  <link
    rel="icon"
    type="image/png"
    href="https://github.com/pak-yo.png"
  >

  <meta
    name="description"
    content="Aplikasi Rapor Digital"
  >

  <meta name="theme-color" content="#0f172a">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
    }

    .app-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
    }

    .app-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #334155;
      background: #f8fafc;
      z-index: 1;
      transition: opacity 0.3s ease;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #cbd5e1;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading p {
      font-size: 14px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 600px) {
      .loading p {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <main class="app-container">

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Memuat Rapor Digital...</p>
    </div>

    <iframe
      class="app-frame"
      id="appFrame"
      src="https://script.google.com/a/macros/guru.smp.belajar.id/s/AKfycby5qT9CmqhfssTPpcm3QyWJfjNU9cCLF7jA9ZiL1hGQ8I_tR1UGr-x5_FI5uDSkTAmI/exec"
      title="Aplikasi Rapor Digital"
      allow="fullscreen"
      allowfullscreen
      loading="eager"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>

  </main>

  <script>
    const frame = document.getElementById("appFrame");
    const loading = document.getElementById("loading");

    frame.addEventListener("load", function () {
      loading.style.opacity = "0";

      setTimeout(() => {
        loading.style.display = "none";
      }, 300);
    });
  </script>
</body>
</html>
