
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Rapor Digital</title>
  <link rel="icon" href="https://github.com/pak-yo.png">
  <meta name="theme-color" content="#0f172a">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body, main {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    main {
      position: relative;
      background: #f8fafc;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    #loading {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #f8fafc;
      color: #334155;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #cbd5e1;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    #error {
      display: none;
      max-width: 420px;
      line-height: 1.6;
      font-size: 14px;
    }

    #error a {
      color: #2563eb;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <main>
    <div id="loading">
      <div class="spinner"></div>
      <p id="status">Memuat Rapor Digital...</p>
      <p id="error">
        Aplikasi tidak dapat ditampilkan di dalam halaman ini.
        Silakan
        <a
          href="https://script.google.com/a/macros/guru.smp.belajar.id/s/AKfycby5qT9CmqhfssTPpcm3QyWJfjNU9cCLF7jA9ZiL1hGQ8I_tR1UGr-x5_FI5uDSkTAmI/exec"
          target="_blank"
          rel="noopener noreferrer"
        >buka aplikasi di tab baru</a>.
      </p>
    </div>

    <iframe
      id="appFrame"
      src="https://script.google.com/a/macros/guru.smp.belajar.id/s/AKfycby5qT9CmqhfssTPpcm3QyWJfjNU9cCLF7jA9ZiL1hGQ8I_tR1UGr-x5_FI5uDSkTAmI/exec"
      title="Rapor Digital"
      allow="fullscreen"
      allowfullscreen
    ></iframe>
  </main>

  <script>
    const frame = document.getElementById("appFrame");
    const loading = document.getElementById("loading");
    const status = document.getElementById("status");
    const error = document.getElementById("error");

    let loaded = false;

    frame.addEventListener("load", function () {
      loaded = true;
      status.style.display = "none";
      document.querySelector(".spinner").style.display = "none";

      // Jika halaman login Google atau aplikasi tidak dapat ditampilkan,
      // pemeriksaan lintas domain tidak dapat dilakukan dari sini.
      // Karena itu, jangan menyatakan aplikasi pasti berhasil.
      setTimeout(function () {
        loading.style.display = "none";
      }, 800);
    });

    // Menangani kemungkinan iframe tidak selesai dimuat.
    setTimeout(function () {
      if (!loaded) {
        status.style.display = "none";
        document.querySelector(".spinner").style.display = "none";
        error.style.display = "block";
      }
    }, 15000);
  </script>
</body>
</html>
