
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f9">
  <meta name="description" content="Rapor Digital | SMP Negeri 8 Kota Pontianak">
  <title>Rapor Digital</title>

  <link rel="icon" type="image/png" href="https://github.com/pak-yo.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f9;
      color: #1f2937;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 460px;
      padding: 32px 24px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .logo {
      width: 76px;
      height: 76px;
      object-fit: contain;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    p {
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 14px 18px;
      border-radius: 10px;
      background: #1d4ed8;
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
    }

    .button:hover {
      background: #1e40af;
    }

    .note {
      margin-top: 16px;
      margin-bottom: 0;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="container">
    <img
      class="logo"
      src="https://github.com/pak-yo.png"
      alt="Logo Pak Yo"
    >

    <h1>Rapor Digital</h1>

    <p>
      SMP Negeri 8 Kota Pontianak<br>
      Silakan buka aplikasi untuk melanjutkan.
    </p>

    <a
      class="button"
      href="https://script.google.com/a/macros/guru.smp.belajar.id/s/AKfycbxtSNROFThaIQTWrInP8f4y1HDHXgwNculVmvu-bZnPIY6BkVgtPIXwn0Y0YHyBDsfR/exec"
      target="_top"
      rel="noopener"
    >
      Buka Aplikasi Rapor Digital
    </a>

    <p class="note">
      Jika diminta, masuk menggunakan akun Google yang memiliki akses.
    </p>
  </main>
</body>
</html>
