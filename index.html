<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portal Pak Yo</title>
  <meta name="description" content="Portal pembelajaran Pak Yo">
  <meta name="theme-color" content="#0f766e">

  <!-- Logo / ikon -->
  <link rel="icon" type="image/png" href="https://github.com/pak-yo.png">
  <link rel="apple-touch-icon" href="https://github.com/pak-yo.png">

  <style>
    :root {
      --bg: #f4f7f6;
      --ink: #12312d;
      --muted: #5b7470;
      --accent: #0f766e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1a18;
        --ink: #e6f2ef;
        --muted: #8fb0aa;
        --accent: #2dd4bf;
      }
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    /* Aplikasi memenuhi layar di laptop, komputer, tablet, dan HP */
    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: 0;
      display: block;
      background: var(--bg);
    }

    /* Layar pemuatan */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
      background: var(--bg);
      transition: opacity .4s ease, visibility .4s ease;
    }
    #loader.done { opacity: 0; visibility: hidden; }

    #loader img {
      width: clamp(72px, 18vw, 112px);
      height: auto;
      border-radius: 50%;
    }
    #loader p {
      margin: 0;
      font-size: clamp(.95rem, 2.6vw, 1.1rem);
      color: var(--muted);
    }
    .bar {
      width: min(220px, 60vw);
      height: 4px;
      border-radius: 4px;
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      overflow: hidden;
    }
    .bar::before {
      content: "";
      display: block;
      height: 100%;
      width: 40%;
      background: var(--accent);
      border-radius: 4px;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(260%); }
    }

    /* Muncul bila pemuatan terlalu lama */
    #fallback {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    #fallback.show { display: flex; }
    #fallback a {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    @media (prefers-color-scheme: dark) {
      #fallback a { color: #05201c; }
    }
    #fallback a:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      .bar::before { animation: none; width: 100%; }
      #loader { transition: none; }
    }
  </style>
</head>
<body>

  <div id="loader" role="status" aria-live="polite">
    <img src="https://github.com/pak-yo.png" alt="Logo Pak Yo">
    <p>Memuat aplikasi…</p>
    <div class="bar" aria-hidden="true"></div>
    <div id="fallback">
      <p>Pemuatan lebih lama dari biasa.</p>
      <a id="openLink" href="#" target="_blank" rel="noopener">Buka di tab baru</a>
    </div>
  </div>

  <iframe
    id="app"
    title="Portal Pak Yo"
    allow="fullscreen; clipboard-write; clipboard-read; camera; microphone; geolocation; autoplay"
    allowfullscreen
    referrerpolicy="no-referrer-when-downgrade"></iframe>

  <noscript>
    <p style="position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#fff;color:#000;padding:24px;text-align:center;">
      Aktifkan JavaScript di browser Anda untuk membuka aplikasi ini.
    </p>
  </noscript>

  <script>
    (function () {
      // Tautan Web App Google Apps Script
      var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtSNROFThaIQTWrInP8f4y1HDHXgwNculVmvu-bZnPIY6BkVgtPIXwn0Y0YHyBDsfR/exec";

      var frame    = document.getElementById("app");
      var loader   = document.getElementById("loader");
      var fallback = document.getElementById("fallback");
      var openLink = document.getElementById("openLink");

      // Teruskan parameter URL (misalnya ?page=admin) ke Web App
      var url = SCRIPT_URL + (window.location.search || "");
      openLink.href = url;

      frame.addEventListener("load", function () {
        loader.classList.add("done");
        setTimeout(function () { loader.style.display = "none"; }, 450);
      });

      // Tampilkan tombol cadangan bila terlalu lama
      setTimeout(function () {
        if (!loader.classList.contains("done")) fallback.classList.add("show");
      }, 8000);

      frame.src = url;
    })();
  </script>
</body>
</html>
